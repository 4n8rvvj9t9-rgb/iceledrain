<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="冰雨机">
<meta name="theme-color" content="#f3f6f8">
<title>冰雨机</title>
<style>
/* Layout: a cold, clear window on a rainy day. Home = one page: a see-through clock, a frosted polaroid with a little raindrop beside it, then app icons as glassy water drops.
   Apps open as full pages of thin frosted panels. One light theme only: ice blue, white, grey. */
:root{
  --glass:255,255,255; --ga:.22; --gb:rgba(255,255,255,.7); --gh:rgba(255,255,255,.8); --ts:rgba(255,255,255,.7);
  --bg:#f3f6f8; --bg2:#fafcfd; --ink:#3a4a55; --muted:#8a9ca8; --line:rgba(160,190,208,.35);
  --accent:#8db8d2; --accent-soft:#e6f0f5; --accent-ink:#ffffff; --deep:#5d88a2; --red:#e07f92;
  --alpha:.92; --panel-rgb:255,255,255;
  --panel:rgba(var(--panel-rgb),var(--alpha));
  --display:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --cute:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --fs:15px; color-scheme:light; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;min-height:100dvh;margin:0}
/* Safari stops fixed layers above its bottom toolbar; paint the canvas to match the wall's bottom so no pale strip shows */
html{background:#e3edf3}
/* iOS home-screen apps leave out the status bar's height from the viewport, so full-screen layers stop short; JS sets --app-h to the real screen height there */
.wall,.home,.app,.sheet,.call{bottom:auto;height:var(--app-h,100dvh);min-height:100%;box-sizing:border-box}
body{background:linear-gradient(180deg,#f8fbfc 0%,#eef4f8 55%,#e3edf3 100%) fixed;color:var(--ink);font:var(--fs)/1.6 var(--body);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.wall{position:fixed;inset:0;z-index:0;background:
  radial-gradient(70% 40% at 85% 0%,rgba(255,255,255,.9),transparent 70%),
  radial-gradient(60% 45% at 0% 100%,rgba(196,221,236,.5),transparent 70%),
  linear-gradient(180deg,#f8fbfc 0%,#eef4f8 55%,#e3edf3 100%);background-size:cover;background-position:center}
.wall.img{background-size:cover!important}

/* ---------- home ---------- */
.home{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
  padding:calc(var(--sat) + 8px) 0 calc(var(--sab) + 6px)}

.spark{width:100%;height:60px;color:var(--accent);display:block}
.rej{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--red)}
.rej i{width:15px;height:15px;border-radius:50%;background:var(--red);color:#fff;font:700 10px/15px var(--body);text-align:center;font-style:normal}
.notice{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;font-size:13.5px;color:var(--muted);min-height:40px;flex-wrap:wrap}
.foot input{flex:1;min-width:0}

/* ---------- app page ---------- */
.app{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;background:transparent;transform:scale(.28);opacity:0;pointer-events:none;transition:transform .38s cubic-bezier(.2,.85,.25,1),opacity .26s ease;border-radius:30px;overflow:hidden}
.app.open{transform:none;opacity:1;pointer-events:auto;border-radius:0}
.app .wall2{position:absolute;inset:0;z-index:-1}
@media (prefers-reduced-motion:reduce){.app{transition:none}}
.bar{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;align-items:center;background:var(--panel);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
  padding:calc(var(--sat) + 6px) max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px))}
.bar h1{margin:0;font:400 20px/1.2 var(--display);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 small{display:block;font:11px var(--body);color:var(--muted);letter-spacing:.06em}
.bk{justify-self:start;background:none;border:0;color:var(--deep);font-size:15px;padding:8px 8px;display:flex;align-items:center;gap:2px}
.bk svg{width:20px;height:20px}
.br{justify-self:end;display:flex}
.tb{background:none;border:0;color:var(--deep);font-size:14px;padding:8px 8px;white-space:nowrap}
.tb:disabled{opacity:.3}
.content{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(28px + var(--sab)) max(16px,env(safe-area-inset-left,0px))}
.foot{display:flex;gap:8px;align-items:flex-end;background:var(--panel);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + var(--sab)) max(10px,env(safe-area-inset-left,0px))}
.foot textarea{flex:1;min-width:0;min-height:0;height:40px;max-height:140px;resize:none;border-radius:20px;padding:8px 14px}
.foot .sq{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--deep);display:grid;place-items:center;padding:0}
.foot .sq.go{background:var(--accent);color:var(--accent-ink)}
.foot .sq svg{width:20px;height:20px}

.panel{background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;padding:15px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font:400 17px var(--display);color:var(--deep);display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.ck{display:flex;align-items:center;gap:9px;font-size:14.5px}
.ck input,.cbx{width:20px;height:20px;accent-color:var(--accent);flex:none}
input[type=text],input[type=password],input[type=number],input[type=url],textarea,select{font:16px/1.5 var(--body);color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;box-sizing:border-box}
textarea{min-height:96px;resize:vertical}
textarea.tall{min-height:220px}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-soft))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--accent-soft)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 2px 6px rgba(20,40,55,.2);margin-top:-8px}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line)}
.inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.inline output{font-size:13px;min-width:3em;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;white-space:nowrap}
.btn.o{background:var(--accent-soft);color:var(--deep)}
.btn.red{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.btn:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input{position:absolute;inset:0;opacity:0;font-size:0}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:11px;color:var(--muted);font-size:13.5px}
.seg button.on{background:var(--panel);color:var(--deep);font-weight:600;box-shadow:0 1px 4px rgba(63,127,163,.15)}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px;overflow-x:auto}
.tabs button{flex:1;background:none;border:0;padding:8px 10px;border-radius:12px;color:var(--muted);white-space:nowrap;font-size:14px}
.tabs button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}

.row{display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;width:100%;text-align:left;box-sizing:border-box}
.row .meta{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.row b{display:block;font-weight:600}
.row small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .side.h{flex-direction:row;align-items:center}
.pill{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--deep);white-space:nowrap}
.pill.fill{background:var(--accent);color:var(--accent-ink)}
.pill.n{background:var(--red);color:#fff}
.light{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.light.green{background:#5cbf8a}.light.yellow{background:#e8bd4a}.light.red{background:var(--red)}
.lights{display:flex;gap:8px}
.lights button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:9px 4px;font-size:13px}
.lights button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--deep);font-weight:600}

.av{--s:44px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--deep);font:400 calc(var(--s)*.46) var(--display);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.stack{display:flex}.stack .av{margin-left:-14px;box-shadow:0 0 0 2px var(--bg)}.stack .av:first-child{margin-left:0}
.empty{text-align:center;color:var(--muted);padding:44px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty big{font:400 26px var(--display);color:var(--ink)}

/* chat */
.chat{gap:10px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg.me{justify-content:flex-end}
.msg .who{font-size:11.5px;color:var(--muted);margin:0 0 2px 4px}
.msg .col{display:flex;flex-direction:column;gap:4px;max-width:76%;min-width:0}
.msg.me .col{align-items:flex-end}
.bub{padding:9px 13px;border-radius:20px;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;text-align:left;font:inherit;color:inherit;border-top-left-radius:6px}
.msg.me .bub{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-top-left-radius:20px;border-top-right-radius:6px}
.stk{border:0;background:none;padding:0}
.stk img{width:112px;height:112px;object-fit:contain;display:block}
.narr{align-self:stretch;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px 17px;white-space:pre-wrap;font:calc(var(--fs) + 1px)/1.85 var(--display);text-align:left;color:inherit}
.narr.me{background:var(--accent-soft);border-color:transparent}
.stamp{align-self:center;font-size:11.5px;color:var(--muted);background:var(--panel);padding:1px 10px;border-radius:999px}
.fold{align-self:stretch;border-radius:14px;font-size:13.5px}
.fold summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--deep);font-size:12px;padding:2px 10px;border-radius:999px;background:var(--accent-soft)}
.fold summary::-webkit-details-marker{display:none}
.fold summary svg{width:13px;height:13px}
.fold div{margin-top:5px;padding:9px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.fold.inner div{background:linear-gradient(135deg,var(--accent-soft),transparent);border:1px dashed var(--accent);font-family:var(--cute);color:var(--deep)}
.fold.think div{background:var(--bg2);border:1px solid var(--line);color:var(--muted);font-size:12.5px}
.msg.me .fold{align-self:flex-end}
.dots{display:inline-flex;gap:5px;padding:5px 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.sumcard{background:var(--accent-soft);border-radius:16px;padding:10px 13px;font-size:13px;color:var(--deep);text-align:left;border:0}

/* plaza */
.post{display:flex;gap:10px;padding:13px;background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;width:100%;box-sizing:border-box}
.post .pb{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.post .hd{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.post .hd b{font-weight:600}
.post .hd span{color:var(--muted);font-size:12px}
.post .tx{white-space:pre-wrap;word-break:break-word}
.post .ft{display:flex;gap:22px;font-size:12.5px;color:var(--muted)}
.post .ft button{background:none;border:0;padding:2px 0;color:inherit}
.post .ft .lk{color:var(--red)}
.prof{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;padding:0 15px 15px}
.banner{height:110px;margin:0 -15px;background:linear-gradient(135deg,var(--accent),var(--accent-soft)) center/cover}
.prof .av{margin-top:-44px;box-shadow:0 0 0 4px var(--panel)}
.prof h3{margin:0;font:400 22px var(--display)}
.prof .h{color:var(--muted);font-size:13px}
.stats{display:flex;gap:18px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink)}
.wallet{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,var(--deep),var(--accent));color:#fff;border-radius:18px;padding:13px 16px}
.wallet b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.wallet small{font-size:12px;opacity:.85}
.wallet .btn{background:rgba(255,255,255,.22);color:#fff}

/* stickers */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.sgrid button{border:1px solid var(--line);background:var(--bg2);border-radius:14px;padding:5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.sgrid img{width:100%;aspect-ratio:1;object-fit:contain;max-width:100%}
.sgrid span{font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}

/* diary */
.dia{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 16px 10px;display:flex;flex-direction:column;gap:8px}
.dia .hd{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.dia .hd b{flex:1;color:var(--ink);font:400 16px var(--display)}
.dia .hd>span:last-child{width:100%;font-size:12px}
.dia .hd{flex-wrap:wrap}
.dia .tx{white-space:pre-wrap;font:16.5px/1.9 var(--display);background:repeating-linear-gradient(transparent 0 calc(1.9em - 1px),var(--line) calc(1.9em - 1px) 1.9em)}

/* sheet, toast */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(30,50,65,.32);display:flex;align-items:flex-end}
.sheet-in{width:100%;max-height:82%;overflow-y:auto;box-sizing:border-box;background:var(--bg);border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:8px;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(16px + var(--sab)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in h3{margin:0 0 4px;font:400 20px var(--display);text-align:center}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:center;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px}
.opt.l{justify-content:flex-start}
.opt.l span{flex:1;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.opt i{font-style:normal;color:var(--muted)}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px;display:flex;flex-direction:column;gap:6px}
.grp .opt{border:0;border-radius:12px;padding:11px 12px;background:none}.grp .opt+.opt{border-top:1px solid var(--line);border-radius:0}
.grp .sec{margin:4px 6px 0}
.opt.red,.tb.red{color:var(--red)}
.sec{font-size:12px;color:var(--muted);margin-top:4px}
/* order */
.order{width:220px;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:11px 13px;display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--ink)}
.order small{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.order small svg{width:14px;height:14px}
.order b{font-size:15px;font-weight:600}
.order .os{font-size:12px;color:var(--deep)}
.order.done .os{color:var(--muted)}
.tphoto .tp-in{border:0;width:100%;text-align:left;cursor:pointer}
.tp-f{display:flex;justify-content:space-between;align-items:center}
.tp-f small{font-size:10.5px;color:#9aa6ae}
.tp-f .tb{font-size:12px;padding:2px 4px;color:#3f7fa3}
.pcap{font-size:12px;color:var(--muted);max-width:200px}
.dnum{font:300 20px var(--body);color:var(--deep)}
.mlist{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto}
.mlist .opt{justify-content:flex-start;font-size:13.5px;padding:10px 13px}

/* calendar & cycle */
.calw{border-radius:24px;padding:12px 10px 10px}
.calh{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.calh b{font:400 18px var(--display)}
.calh .tb{font-size:24px;padding:2px 12px}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.calg.wd span{text-align:center;font-size:11.5px;color:var(--muted);padding-bottom:4px}
.cd{position:relative;border:0;background:none;border-radius:12px;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:46px;color:var(--ink)}
.cd b{font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.cd small{font-size:9.5px;color:var(--muted);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 1px}
.cd.fest small{color:var(--deep)}
.cd.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cd.log{background:rgba(74,122,158,.28)}
.cd.fert{background:rgba(255,255,255,.75)}.cd.ovu{background:#fff;box-shadow:inset 0 0 0 1.5px var(--deep)}.lg.fert{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}.lg.ovu{background:#fff;box-shadow:inset 0 0 0 1.5px var(--deep)}
.cd.pred{box-shadow:inset 0 0 0 1.5px rgba(74,122,158,.65);border-radius:12px}
.cd.pred.today{box-shadow:inset 0 0 0 1.5px var(--accent),inset 0 0 0 3px rgba(74,122,158,.5)}
.cd i{position:absolute;top:1px;right:4px;font-style:normal;font-size:10px;color:var(--deep)}
.legend{display:flex;gap:14px;justify-content:center;font-size:11.5px;color:var(--muted);padding-top:8px}
.legend span{display:flex;align-items:center;gap:4px}.legend i{font-style:normal;color:var(--deep)}
.lg{width:12px;height:12px;border-radius:4px;display:inline-block}.lg.log{background:rgba(74,122,158,.4)}.lg.pred{box-shadow:inset 0 0 0 1.5px rgba(74,122,158,.7)}

<script>
/* ================= utils ================= */
const $=s=>document.querySelector(s);
const appEl=$('#app'),homeEl=$('#home');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=n=>String(n).padStart(2,'0');
const WK='日一二三四五六';
const CN_MON=['一','二','三','四','五','六','七','八','九','十','十一','十二'];
function cnDay(n){const a='〇一二三四五六七八九';if(n<=10)return n===10?'十':a[n];if(n<20)return'十'+a[n%10];return a[Math.floor(n/10)]+'十'+(n%10?a[n%10]:'')}
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return'刚刚';if(s<3600)return Math.floor(s/60)+'分钟前';if(s<86400)return Math.floor(s/3600)+'小时前';const d=new Date(t);return(d.getMonth()+1)+'/'+d.getDate()}
function hm(t){const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())}
let toastT;
function toast(m,ms=3200){const t=$('#toast');t.textContent=trS(m);t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms)}
function sheet(html){$('#sheetIn').innerHTML=html;tr($('#sheetIn'));$('#sheet').hidden=false}
function closeSheet(){$('#sheet').hidden=true}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

function readImg(file,max,cb,type='image/jpeg',err){
  if(file.type==='image/gif'&&file.size<900000){const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file);return}
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(type,.85))};im.onerror=()=>{toast('这张图读不出来');err&&err()};im.src=r.result};r.readAsDataURL(file)}
async function unzip(buf){const d=new DataView(buf),u=new Uint8Array(buf),out={};let e=buf.byteLength-22;while(e>=0&&d.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('压缩包打不开');
  for(let i=0,p=d.getUint32(e+16,true);i<d.getUint16(e+10,true);i++){const m=d.getUint16(p+10,true),cs=d.getUint32(p+20,true),nl=d.getUint16(p+28,true),off=d.getUint32(p+42,true),name=new TextDecoder().decode(u.subarray(p+46,p+46+nl));p+=46+nl+d.getUint16(p+30,true)+d.getUint16(p+32,true);
    if(name.endsWith('/'))continue;const st=off+30+d.getUint16(off+26,true)+d.getUint16(off+28,true),raw=u.subarray(st,st+cs);
    out[name]=m?new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()):raw.slice()}
  return out}
async function readDoc(f){if(/\.docx$/i.test(f.name)){const x=new TextDecoder().decode((await unzip(await f.arrayBuffer()))['word/document.xml']||new Uint8Array());
    return new DOMParser().parseFromString(x.replace(/<\/w:p>/g,'\n').replace(/<w:(tab|br)\/>/g,' ').replace(/<[^>]+>/g,''),'text/html').documentElement.textContent.trim()}
  const t=await readText(f);return /\.html?$/i.test(f.name)?new DOMParser().parseFromString(t,'text/html').body.textContent.trim():t}
function readText(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsText(file)})}

  return`<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="心情水位曲线"><line x1="0" x2="${w}" y1="${h/2}" y2="${h/2}" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`}
function av(o,s=44){const nm=(o&&(o.name||o.title))||'?';return`<span class="av" style="--s:${s}px">${o&&o.avatar?`<img src="${esc(o.avatar)}" alt="">`:esc([...nm][0]||'?')}</span>`}

const WX={0:'晴',1:'晴间多云',2:'多云',3:'阴',45:'有雾',48:'雾凇',51:'毛毛雨',53:'毛毛雨',55:'毛毛雨',56:'冻雨',57:'冻雨',61:'小雨',63:'中雨',65:'大雨',66:'冻雨',67:'冻雨',71:'小雪',73:'中雪',75:'大雪',77:'雪粒',80:'阵雨',81:'阵雨',82:'暴雨',85:'阵雪',86:'大雪',95:'雷阵雨',96:'雷阵雨',99:'雷暴'};
const wxKey=l=>l&&l.lat!==undefined?(+l.lat).toFixed(2)+','+(+l.lon).toFixed(2):'';
const wxJobs={};
function wxNow(l){const k=wxKey(l),x=k&&(S.wx||{})[k];if(!x||!x.d?.current)return null;const c=x.d.current,dl=x.d.daily||{},g=(a,i)=>a&&a[i]!==undefined?Math.round(a[i]):'';
  return{temp:Math.round(c.temperature_2m),feel:Math.round(c.apparent_temperature),desc:WX[c.weather_code]||'—',min:g(dl.temperature_2m_min,0),max:g(dl.temperature_2m_max,0),tm:WX[(dl.weather_code||[])[1]]||'',tmin:g(dl.temperature_2m_min,1),tmax:g(dl.temperature_2m_max,1)}}
function ensureWx(l){const k=wxKey(l);if(!k||!S.chat.world)return Promise.resolve();const x=(S.wx||={})[k];if(x&&Date.now()-x.t<45*60e3)return Promise.resolve();if(wxJobs[k])return wxJobs[k];
  wxJobs[k]=(async()=>{try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),5000);
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${l.lat}&longitude=${l.lon}&current=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=2`,{signal:ctl.signal});clearTimeout(tm);
    if(r.ok){const d=await r.json();if(d.current){S.wx[k]={t:Date.now(),d};save()}}}catch(e){}finally{delete wxJobs[k]}})();return wxJobs[k]}
async function geoSearch(q){const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=zh&name='+encodeURIComponent(q));if(!r.ok)throw new Error('查不到，检查一下网络');const d=await r.json();return(d.results||[]).map(x=>({name:x.name,admin:[x.admin1,x.country].filter(Boolean).join(' · '),lat:x.latitude,lon:x.longitude}))}
let lunarFmt=null;
function lunarMD(d){try{lunarFmt=lunarFmt||new Intl.DateTimeFormat('en-u-ca-chinese',{month:'numeric',day:'numeric'});const p=lunarFmt.formatToParts(d);const mo=p.find(x=>x.type==='month')?.value||'',da=p.find(x=>x.type==='day')?.value||'';return{m:parseInt(mo),d:parseInt(da),leap:/\D/.test(mo)}}catch(e){return null}}
function lunarText(d){const l=lunarMD(d);if(!l||!l.m)return'';const M=['正','二','三','四','五','六','七','八','九','十','冬','腊'],N='一二三四五六七八九十';
  const dd=l.d<=10?'初'+N[l.d-1]:l.d<20?'十'+N[l.d-11]:l.d===20?'二十':l.d<30?'廿'+N[l.d-21]:'三十';return(l.leap?'闰':'')+M[l.m-1]+'月'+dd}
function upcomingFest(n=7){const out=[],t=new Date();for(let i=0;i<=n;i++){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i);festOf(d).forEach(f=>out.push({name:f,in:i}))}return out}
function mdOf(s){const m=String(s||'').trim().match(/(\d{1,2})[-/.月](\d{1,2})日?$/);return m&&+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31?[+m[1],+m[2]]:null}
function daysUntil(md){const t=new Date();const t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());let d=new Date(t0.getFullYear(),md[0]-1,md[1]);if(d<t0)d=new Date(t0.getFullYear()+1,md[0]-1,md[1]);return Math.round((d-t0)/864e5)}
function daysSince(s){const p=String(s||'').split('-').map(Number);if(p.length<3||!p[0])return null;const d=new Date(p[0],p[1]-1,p[2]),t=new Date();t.setHours(0,0,0,0);return Math.round((t-d)/864e5)}
function myDays(){const me=mask(),L=[];if(me.bday)L.push({name:me.name+'的生日',md:mdOf(me.bday),who:null});
  S.chars.filter(c=>c.bday&&!rel(c).youDeleted).forEach(c=>L.push({name:dn(c)+'的生日',md:mdOf(c.bday),who:c.id}));
  (S.days||[]).forEach(x=>L.push({id:x.id,name:x.name,md:mdOf(x.date),date:x.date,who:x.charId||null,since:daysSince(x.date)}));
  return L.filter(x=>x.md).map(x=>({...x,in:daysUntil(x.md)})).sort((a,b)=>a.in-b.in)}
function worldFor(chars){if(!S.chat.world)return'';const me=mask(),L=[];
  const w=wxNow(S.loc);if(w)L.push(`${me.name}在${S.loc.name}：现在${w.desc}，${w.temp}°C（体感${w.feel}°C），今天${w.min}~${w.max}°C${w.tm?`，明天${w.tm} ${w.tmin}~${w.tmax}°C`:''}`);
  chars.forEach(c=>{if(!c.loc)return;if(wxKey(c.loc)===wxKey(S.loc)){L.push(`${c.name}也在${c.loc.name}`);return}const x=wxNow(c.loc);L.push(x?`${c.name}在${c.loc.name}：现在${x.desc}，${x.temp}°C，今天${x.min}~${x.max}°C`:`${c.name}在${c.loc.name}`)});
  const cw=cycleWorld();if(cw)L.push(cw);
  upcomingFest(7).forEach(f=>L.push(f.in===0?`今天是${f.name}`:`${f.in===1?'明天':f.in===2?'后天':f.in+'天后'}是${f.name}`));
  myDays().filter(x=>x.who===null||chars.some(c=>c.id===x.who)).forEach(x=>{
    if(x.in===0)L.push(`今天是${x.name}${x.since>0?`（从${x.date}算起已经${x.since}天）`:''}`);else if(x.in<=7)L.push(`${x.in===1?'明天':x.in+'天后'}是${x.name}`);
    if(x.since>0&&x.in!==0&&x.since%100===0)L.push(`今天是「${x.name}」的第${x.since}天`)});
  return L.length?'【天气和日子】（真实的，自然地带进聊天里，不用每句都提）\n'+L.join('\n'):''}

}

      res=await fetch(base+'/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(b)});

function loreFor(chars,scanText){
  const books=S.books.filter(b=>b.scope==='global'||chars.some(c=>(c.books||[]).includes(b.id)));
  const low=scanText.toLowerCase();
  return books.flatMap(b=>b.entries).filter(e=>{
    if(e.light==='red')return false;
    if(e.light!=='green'){const ks=String(e.keys||'').split(/[,，、\n]+/).map(k=>k.trim().toLowerCase()).filter(Boolean);if(!ks.some(k=>low.includes(k)))return false}
    return Math.random()*100<(num(e.prob)??100);
  }).sort((a,b)=>(a.order||0)-(b.order||0)).map(e=>e.content).filter(Boolean);
}

async function bbFans(o){

  const posts=S.feed.filter(p=>p.author==='me').slice(-3);if(posts.length)L.push('雨巷上发的动态：'+posts.map(p=>p.text).join(' / '));

  const ctx=buildCtx(t);
  const out=await callAI(ctx.system,[...ctx.msgs,{role:'user',content:`（${how==='open'?me.name+'把手机递给你，让你随便看':'你趁'+me.name+'不注意，偷偷拿起了TA的手机'}。下面是TA手机里真实的内容：\n${L.join('\n')}\n\n按你翻看的顺序写4到7步，每步一行，格式「应用｜看到了什么｜心里想什么」。看完以后，最后一行写「[说] 你要对${me.name}说的话」，几句话用 / 分开${how==='open'?'':'（如果你不想让TA知道你偷看了，也可以装作什么都没发生，说点别的）'}。最后写 <tide>数字|心情</tide>。）`}],{max:2048});

  if(!steps.length)throw new Error('TA没看出什么，再试一次');

function toBook(d,fallback){
  if(Array.isArray(d))d={entries:d};

  if(!raw.length&&!src.entries)raw=Object.entries(src).filter(([k,v])=>typeof v==='string'&&!['name','scope','description'].includes(k)).map(([k,v])=>({title:k,content:v,constant:true}));
  if(!raw.length)throw new Error('这个文件里没找到世界书条目');
  return{id:uid(),name:src.name||d.name||fallback||'导入的世界书',scope:d.scope==='local'?'local':'global',entries:raw.map((e,i)=>({id:uid(),
    title:e.title||e.comment||e.name||('条目 '+(i+1)),keys:[].concat(e.key||e.keys||[]).join(','),content:e.content||'',
    light:e.light||((e.disable||e.enabled===false)?'red':(e.constant?'green':'yellow')),
    prob:e.prob??((e.useProbability===false)?100:(e.probability??100)),order:e.order??e.insertion_order??i}))};
}
function textBook(t,name){const L=t.replace(/\r/g,'').split('\n'),H=l=>{const m=l.match(/^\s*(?:#{1,6}\s*(.+?)\s*#*|【([^】]{1,30})】\s*(.*)|\[([^\]]{1,30})\]\s*(.*))\s*$/);return m&&[m[1]||m[2]||m[4],m[3]||m[5]||'']};
  const useH=L.some(H),bl=[];let b=null;
  for(const l of L){const h=useH&&H(l);if(h){bl.push(b={t:h[0],c:h[1]?[h[1]]:[]});continue}if(!l.trim()){if(!useH)b=null;continue}if(!b)bl.push(b={t:'',c:[]});b.c.push(l)}
  const entries=bl.map((x,i)=>{let keys='';const c=x.c.filter(l=>{const k=l.match(/^\s*(?:关键词|关键字|触发词|keys?)\s*[:：]\s*(.+)/i);if(k)keys=k[1];return!k});const title=x.t||(c.length>1&&c[0].length<=24?c.shift():'');
    return{id:uid(),title:title||('条目 '+(i+1)),keys,content:c.join('\n').trim(),light:keys?'yellow':'green',prob:100,order:i}}).filter(e=>e.content);
  if(!entries.length)throw new Error('这个文件里没找到内容');return{id:uid(),name:name||'导入的世界书',scope:'global',entries}}
const stkJson=(d,k='')=>typeof d==='string'?(/^(https?:|data:image)/.test(d)?[{name:k,src:d}]:[]):Array.isArray(d)?d.flatMap(x=>stkJson(x,k)):d&&typeof d==='object'?(d.url||d.src||d.link?[{name:d.name||d.title||k,src:d.url||d.src||d.link}]:Object.entries(d).flatMap(([kk,v])=>stkJson(v,kk))):[];
const stkLines=t=>t.split('\n').map(l=>{const m=l.match(/(https?:\/\/[^\s"'，,|]+|data:image\S+)/);return m&&{name:l.replace(m[1],'').replace(/[:：,，|\t"']/g,' ').trim(),src:m[1]}}).filter(Boolean);
function toPreset(d,fallback){
  if(Array.isArray(d.items))return{id:uid(),name:d.name||fallback||'导入的预设',items:d.items.map(x=>({id:uid(),name:x.name||'提示词',role:x.role||'system',mode:x.mode||'both',on:x.on!==false,content:x.content||''}))};

  const items=list.filter(p=>(p.content||'').trim()).map(p=>({id:uid(),name:p.name||p.identifier||'提示词',role:['system','user','assistant'].includes(p.role)?p.role:'system',mode:'both',on:p.enabled!==false,content:p.content}));

/* ================= actions ================= */
function purgeChar(id){S.chars=S.chars.filter(c=>c.id!==id);S.threads.forEach(t=>t.chars=t.chars.filter(x=>x!==id));S.threads=S.threads.filter(t=>t.chars.length&&!(t.type==='group'&&t.chars.length<2&&!t.msgs.length));
  S.diary=S.diary.filter(d=>d.charId!==id);S.feed=S.feed.filter(p=>p.author!==id);S.mail=(S.mail||[]).filter(m=>m.to!==id&&m.from!==id);S.events=S.events.filter(e=>e.who!==id);S.theaters=S.theaters.filter(x=>x.charId!==id);if(S.music.with===id)S.music.with=null;
  save();closeSheet();stack=stack.filter(x=>x.id!==id&&!(x.v==='chat'&&!thread(x.id)));if(!stack.length){appEl.classList.remove('open');renderHome()}else render();toast('永久删除了')}
function pickChar(title,act){if(!S.chars.length){toast('先去「消息 · 通讯录」添加一个角色');return}
  sheet(`<h3>${title}</h3>`+S.chars.map(c=>`<button type="button" class="opt l" data-a="${act}" data-id="${c.id}">${av(c,32)}<span>${esc(dn(c))}</span></button>`).join('')+`<button type="button" class="opt" data-a="closeSheet">取消</button>`)}
function fileSheet(title,accept,id,extra=''){sheet(`<h3>${title}</h3>${extra}<label class="opt" style="position:relative;overflow:hidden">选择文件<input type="file" accept="${accept}" id="${id}" style="position:absolute;inset:0;opacity:0"></label><textarea id="${id}Ta" placeholder="或者粘贴 JSON" aria-label="JSON"></textarea><button type="button" class="btn" data-a="${id}Go">导入</button><button type="button" class="opt" data-a="closeSheet">取消</button>`)}
async function copy(t,ok){try{await navigator.clipboard.writeText(t);toast(ok)}catch(e){toast('复制不了，长按文字手动复制')}}
const A={
  back,closeSheet,

  coaxPick(el){const k=el.dataset.k,[,l]=COAX.find(x=>x[0]===k);
    const chips=k==='gift'?COAX_GIFT:k==='song'?S.music.songs.slice(-8).map(s=>s.title):[];

    <button type="button" class="btn" data-a="coaxGo" data-k="${k}">送出去</button><button type="button" class="opt" data-a="coax">换一种</button>`)},

    save();closeSheet();render(true)},
  persist(){(navigator.storage?.persist?navigator.storage.persist():Promise.resolve(false)).then(ok=>{toast(ok?'好了，浏览器不会随便清掉冰雨机的数据':'浏览器没答应，记得常备份');render(true)})},
  imp(){const t=$('#impTa').value.trim();if(!t){toast('先选文件或粘贴备份');return}
    try{const d=JSON.parse(t);if(![2,3,4].includes(d.v))throw 0;const old=S;S=mergeState(d);S.api.profiles.forEach(p=>{if(!p.key){const o=old.api.profiles.find(x=>x.id===p.id)||old.api.profiles.find(x=>x.provider===p.provider&&x.key);if(o?.key)p.key=o.key}});save();applyLook();stack=[];appEl.classList.remove('open');renderHome();toast('恢复好了')}catch(e){toast('这不是冰雨机的备份')}},
  resetAll(el){confirmTap(el,()=>{S=def();save();applyLook();stack=[];appEl.classList.remove('open');renderHome();toast('清空了')})}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el)}});
document.addEventListener('keydown',e=>{const id=e.target.id;if(id==='callIn'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();A.callSend();return}
  if(!['msgIn','mIn','bbIn'].includes(id)||e.key!=='Enter'||e.shiftKey||e.isComposing||e.keyCode===229)return;e.preventDefault();
  if(id==='msgIn')A.send();else if(id==='mIn')A.mSend();else bbSend()});

/* ================= live-bound fields ================= */
function scopeObj(s){const v=cur()||{};
  switch(s){case'look':return S.look;case'root':return S;case'chat':return S.chat;case'char':return charById(v.id);case'mask':return S.masks.find(x=>x.id===v.id);
    case'book':return S.books.find(x=>x.id===v.id);case'entry':return S.books.find(x=>x.id===v.id)?.entries.find(x=>x.id===v.eid);
    case'preset':return S.presets.find(x=>x.id===v.id);case'item':return S.presets.find(x=>x.id===v.id)?.items.find(x=>x.id===v.iid);
    case'bubble':return S.bubble;case'mimg':return S.media.img;case'cycle':return CY();case'mtts':return S.media.tts;case'apiroot':return S.api;case'cvoice':{const c=charById(v.id);return c&&(c.voice||(c.voice={}))}
    case'api':return S.api.profiles.find(x=>x.id===v.id);case'thread':return thread(v.id);case'off':{const t=thread(v.id);return t&&(t.offline||(t.offline={...S.offline}))}}}
function bind(e){const el=e.target;if(!el.dataset||!el.dataset.k)return;const o=scopeObj(el.dataset.s);if(!o)return;
  const val=el.type==='checkbox'?el.checked:(el.type==='range'||el.type==='number')?(el.value===''&&el.dataset.null?null:+el.value):el.value;
  o[el.dataset.k]=val;save();const out=el.parentElement.querySelector('output');if(out)out.textContent=val;
  if(el.dataset.s==='look'){applyLook();if(el.dataset.k==='sfx')sfx(val);if(el.dataset.k==='fxs')S.look.fx=val!=='off'}}
document.addEventListener('input',e=>{if(e.target.id==='mRange'){mSeek(+e.target.value/1000);return}bind(e)});
document.addEventListener('change',async e=>{const el=e.target;bind(e);
  if(el.dataset.a2==='member'){const t=thread(cur().id);if(el.checked){if(!t.chars.includes(el.dataset.id))t.chars.push(el.dataset.id)}else{if(t.chars.length<=2){el.checked=true;toast('群聊至少要 2 个角色');return}t.chars=t.chars.filter(x=>x!==el.dataset.id)}save()}
  if(el.dataset.a2==='charBook'){const c=charById(cur().id);c.books=c.books||[];if(el.checked)c.books.push(el.dataset.id);else c.books=c.books.filter(x=>x!==el.dataset.id);save()}
  if(el.dataset.a2==='itemOn'){S.presets.find(x=>x.id===cur().id).items.find(x=>x.id===el.dataset.id).on=el.checked;save()}
  if(el.dataset.img){const f=el.files?.[0];if(!f)return;const k=el.dataset.img;
    const max={appwall:1400,wall:1600,photo:600,icon:200,char:320,mask:320,cwall:1400,cvbg:1200,twall:1400,banner:1200,chatimg:960}[k]||400;
    readImg(f,max,url=>{if(k==='chatimg'){closeSheet();pushMine(thread(cur().id),{type:'img',img:url,content:''},false);return}
      if(k==='appwall')S.look.appWalls[el.dataset.id]=url;else if(k==='cwall')charById(cur().id).wall=url;else if(k==='cvbg')charById(cur().id).vbg=url;else if(k==='twall')thread(cur().id).wall=url;else if(k==='banner')mask().banner=url;else if(k==='char')charById(cur().id).avatar=url;else if(k==='mask')S.masks.find(x=>x.id===cur().id).avatar=url;else if(k==='icon')S.look.icons[el.dataset.id]=url;else if(k==='wall')S.look.wallpaper=url;else if(k==='photo')S.look.photo=url;
      save();applyLook();if(appEl.classList.contains('open'))render(true);else renderHome()})}
  if(el.dataset.stk){const g=S.stickers.groups.find(x=>x.id===cur().gid);let n=0;
    const img=f=>new Promise(ok=>readImg(f,240,url=>{g.items.push({id:uid(),name:base_(f.name).slice(0,24)||'表情',src:url});n++;ok()},'image/png',ok)),isImg=/\.(png|jpe?g|gif|webp|bmp|avif|heic)$/i;
    for(const f of [...el.files]){try{if(/^image\//.test(f.type)||isImg.test(f.name))await img(f);
      else if(/\.zip$/i.test(f.name)){for(const [nm,u] of Object.entries(await unzip(await f.arrayBuffer())))if(isImg.test(nm)&&!/__MACOSX/.test(nm))await img(new File([u],nm.split('/').pop(),{type:'image/'+nm.split('.').pop().toLowerCase().replace('jpg','jpeg')}))}
      else{const t=await readDoc(f);let d=null;try{d=JSON.parse(t)}catch(e){}for(const x of d?stkJson(d):stkLines(t)){g.items.push({id:uid(),name:String(x.name||'表情'+(allStickers().length+1)).slice(0,24),src:x.src});n++}}}catch(e){toast(e.message||'读不出来')}}
    if(!n){toast('这个文件里没找到表情');return}
    save();render(true);toast('加了 '+n+' 个')}
  if(el.dataset.font){const f=el.files?.[0];if(!f)return;if(!DB.db){toast('这个浏览器存不了字体文件，用链接吧');return}await DB.set('font:custom',f);
    S.look.customFont={local:true,name:base_(f.name),t:Date.now()};S.look.font='custom';fontLoaded='';save();await loadFont();render(true);return}
  if(el.dataset.audio||el.dataset.song){const fs=[...(el.files||[])];if(!fs.length)return;if(!DB.db){toast('这个浏览器存不了音频文件，用链接吧');return}
    let n=0,first=null;
    for(const f of fs){let s=el.dataset.song?songById(el.dataset.song):null;
      if(!s){const [a,b]=splitSong(base_(f.name));s={id:uid(),title:b?b:a,artist:b?a:'',by:'me',t:Date.now()};S.music.songs.push(s)}
      await DB.set('song:'+s.id,f);s.local=true;s.src='';n++;first=first||s.id;if(S.music.cur===s.id)mState.loaded=null}
    save();closeSheet();if(isOpen()&&cur()?.v==='music')render(true);toast(el.dataset.song?'换好了':'加了 '+n+' 首');
    if(!S.music.cur&&first)mLoad(first,false);return}
  if(el.dataset.doc){const f=el.files?.[0];if(!f)return;let t;try{t=(await readDoc(f)).trim()}catch(e){toast('这个文件读不出来');return}if(!t){toast('文件是空的');return}const k=el.dataset.doc;
    if(k==='new'){A.newChar();const c=charById(cur().id);c.name=base_(f.name);c.persona=t}else{const o=k==='char'?charById(cur().id):S.masks.find(x=>x.id===cur().id);o.persona=(o.persona?o.persona+'\n\n':'')+t}
    save();render(true);toast('导入好了');return}
  if(['impFile','impChar','impBook','impPreset'].includes(el.id)){const f=el.files?.[0];if(!f)return;const txt=await(el.id==='impBook'?readDoc(f):readText(f));const ta=$('#'+(el.id==='impFile'?'impTa':el.id+'Ta'));ta.value=txt;ta.dataset.name=base_(f.name);toast('读好了，点「'+(el.id==='impFile'?'恢复':'导入')+'」')}
});

/* ================= boot ================= */
(async()=>{
  await DB.open();
  let raw=await DB.get('state');
  if(!raw){try{const old=JSON.parse(localStorage.getItem('xphone_v1')||'null');if(old&&old.chars){const s=def();s.chars=old.chars.map(c=>({id:c.id,name:c.name,remark:'',handle:(c.name||'').toLowerCase(),avatar:c.avatar||'',innerStyle:'',persona:c.persona||'',greeting:c.greeting||'',books:[]}));
    s.threads=Object.entries(old.chats||{}).filter(([id])=>s.chars.some(c=>c.id===id)).map(([id,ms])=>({id:uid(),type:'dm',chars:[id],title:'',mode:'online',unread:0,t:Date.now(),msgs:ms.map(m=>({id:uid(),from:m.role==='user'?'me':id,type:'text',content:m.content,t:m.t||Date.now()}))}));
    raw=JSON.stringify(s)}}catch(e){}}
  try{S=mergeState(raw?JSON.parse(raw):null)}catch(e){S=def()}
  applyLook();renderHome();loadFont();
  try{const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,180);gr.addColorStop(0,'#f6fafc');gr.addColorStop(1,'#cfe3ef');g.fillStyle=gr;g.fillRect(0,0,180,180);
    g.fillStyle='rgba(106,166,200,.9)';g.beginPath();g.arc(84,100,46,0,7);g.fill();g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.arc(68,84,12,0,7);g.fill();g.fillStyle='rgba(106,166,200,.55)';g.beginPath();g.arc(136,50,14,0,7);g.fill();
    const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)}catch(e){}
  const tick=()=>{const now=Date.now(),m=S.lastTick?Math.min(180,(now-S.lastTick)/60e3):0;S.lastTick=now;if(m>0){softTick(m);lifeTick(m)}applyLook();cyRemind();save()};
  tick();setInterval(tick,20e3);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(saveT);DB.set('state',JSON.stringify(S))}else tick()});
})();
</script>
